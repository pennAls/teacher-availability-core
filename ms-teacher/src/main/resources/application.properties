spring.application.name=ms-teacher
server.port=8083
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:postgresql://localhost:5434/ms-teacher_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

api.security.token.secret=${JWT_SECRET:minhasecretsupersecreta}

# Feign Clients — service discovery via Eureka (name-based routing)
# ms-academic and ms-security are resolved via Eureka service registry.
# No explicit URL needed when using spring-cloud-starter-openfeign with Eureka.

# Optional: Feign timeout configuration
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000